spring.datasource.url=jdbc:h2:mem:free_ticket_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# The migrations are MySQL SQL; H2 tests build the schema from the entities. MigrationTest covers Flyway on MySQL.
spring.flyway.enabled=false
spring.jpa.show-sql=false

SECRET_KEY=test-secret-key-for-jwt-must-be-at-least-32-bytes
jwt.access-expiration-ms=600000
auth.refresh-token-cleanup.enabled=false
toss.secret-key=
toss.api-base-url=https://api.tosspayments.com
payment.recovery.enabled=false
payment.reconciliation.enabled=false
ticket.pricing.enabled=false
spring.task.scheduling.pool.size=2
