# Monitoring: metrics and health live on a separate port that Caddy does not proxy.
# Prometheus scrapes backend:8081/actuator/prometheus inside the Docker network; Caddy exposes only /health.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Health means "can serve bookings": the database. Redis is a cache with a DB fallback, and mail only
# affects signup mail, so neither may mark the whole service DOWN.
management.health.redis.enabled=false
management.health.mail.enabled=false
# Tomcat thread and connection gauges (the 20s/10k test hit max-connections).
server.tomcat.mbeanregistry.enabled=true
# Buckets so Grafana can compute p95/p99 latency per endpoint.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=free-ticket
