spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

#DB Settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# A database that already has tables but no Flyway history (the existing server DB) is recorded
# as version 1 without running V1, so only later migrations run on it. An empty database runs V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# SQL logging is off by default; set SPRING_JPA_SHOW_SQL=true when inspecting queries locally.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Event list cache is opt-in outside Docker Compose.
event-list-cache.enabled=${EVENT_LIST_CACHE_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=3s
spring.data.redis.repositories.enabled=false

SECRET_KEY=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:600000}

# Expired refresh tokens are cleaned in bounded batches outside login.
auth.refresh-token-cleanup.enabled=${REFRESH_TOKEN_CLEANUP_ENABLED:true}
auth.refresh-token-cleanup.delay-ms=${REFRESH_TOKEN_CLEANUP_DELAY_MS:60000}

# Mail for email verification and password reset (Naver SMTP by default).
# Sending stays off (MAIL_NOT_CONFIGURED) until SMTP_USERNAME and SMTP_PASSWORD are set.
# SMTP_PASSWORD is a Naver application password, not the account login password.
spring.mail.host=${SMTP_HOST:smtp.naver.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_USERNAME:}
app.mail.sender-name=FreeTicket

# Accounts whose passwords are published for reviewers (comma separated). They can browse, book and pay,
# but cannot change the account or admin data, and see members' personal data masked in the admin tables.
app.demo.account-emails=${DEMO_ACCOUNT_EMAILS:}

# Toss Payments
toss.secret-key=${TOSS_SECRET_KEY:}
toss.api-base-url=${TOSS_API_BASE_URL:https://api.tosspayments.com}

# Unfinished payments: scan every 30s, retry every 2m, then require manual review.
payment.recovery.enabled=${PAYMENT_RECOVERY_ENABLED:true}
payment.recovery.delay-ms=${PAYMENT_RECOVERY_DELAY_MS:30000}
payment.recovery.retry-delay-ms=${PAYMENT_RECOVERY_RETRY_DELAY_MS:120000}
payment.recovery.max-attempts=${PAYMENT_RECOVERY_MAX_ATTEMPTS:20}

# PG cancellation reconciliation; explicitly opt in after applying the migration.
payment.reconciliation.enabled=${PAYMENT_RECONCILIATION_ENABLED:false}
payment.reconciliation.start-at=${PAYMENT_RECONCILIATION_START_AT:}
payment.reconciliation.delay-ms=${PAYMENT_RECONCILIATION_DELAY_MS:3600000}
payment.reconciliation.initial-delay-ms=${PAYMENT_RECONCILIATION_INITIAL_DELAY_MS:60000}
spring.task.scheduling.pool.size=2
