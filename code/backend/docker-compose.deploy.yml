services:
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.deploy
      args:
        VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY:?required}
        VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:?required}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: .
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_URL: jdbc:mysql://mysql-db:3306/free_ticket?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-600000}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:?required}
      SMTP_USERNAME: ${SMTP_USERNAME:?required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      PAYMENT_RECONCILIATION_ENABLED: ${PAYMENT_RECONCILIATION_ENABLED:-false}
      PAYMENT_RECONCILIATION_START_AT: ${PAYMENT_RECONCILIATION_START_AT:-}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      EVENT_LIST_CACHE_ENABLED: "true"
      REDIS_HOST: redis
      LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_SERVLET_DISPATCHERSERVLET: INFO
      TZ: Asia/Seoul
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: free_ticket
      MYSQL_USER: ${DB_USERNAME:?required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -u root -D free_ticket -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
